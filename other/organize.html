<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>
  <script>
    (function () {
      // 支援 ?cat=...&subcat=... 以及 ?ppid=123（轉發至 GAS 查 QR Sheet）
      var GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbyaUc5UC6uPNyPrqHC2DQNiPfEov6alrmmB9QbQtyYg_WMH5oQZo3qux9wkNicuXozY/exec';

      var incoming = new URLSearchParams(window.location.search);
      var target = new URL(GAS_EXEC_URL);

      incoming.forEach(function (value, key) {
        target.searchParams.set(key, value);
      });

      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
